name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pages-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build PR preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish PR preview
        run: >
          dotnet publish src/CVApp/CVApp.csproj
          -c Release
          --nologo
          -p:ReleaseBaseHref=/CV/preview/pr-${{ github.event.pull_request.number }}/
          -o publish

      - name: Verify experience.json artifact
        run: |
          if [ ! -f "publish/wwwroot/data/experience.json" ]; then
            echo "::error::Publish verification failed: experience.json not found at publish/wwwroot/data/experience.json"
            exit 1
          fi
          echo "Publish verification passed: publish/wwwroot/data/experience.json exists."

      - name: Configure Pages for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: publish/wwwroot

  deploy-preview:
    name: Deploy PR preview
    needs: build-preview
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: preview-site

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: preview-site
          target-folder: preview/pr-${{ github.event.pull_request.number }}
          force: false
          commit-message: "Deploy PR preview for #${{ github.event.pull_request.number }} from ${{ github.sha }}"

      - name: Post preview link comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-link
          message: |
            ✅ PR preview published.

            [Open preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}/)
