name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Authenticate gh CLI
        run: echo "$GITHUB_TOKEN" | gh auth login --with-token

      - name: Confirm Copilot issue permissions configuration
        run: echo "Copilot agent sessions can use gh issue with issues:write permission."
