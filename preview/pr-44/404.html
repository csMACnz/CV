<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVApp</title>
    <base href="/CV/preview/pr-44/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

  </head>
  <body>
    <div id="app">
    </div>
    <div id="blazor-error-ui">

    <!-- Loading overlay -->

            <path d="M45,-62.7C58.3,-52.8,69.1,-39.8,74.5,-24.7C79.8,-9.6,79.7,7.6,74.1,23.3C68.5,39,57.4,53.2,43.2,62.8C29,72.4,11.7,77.4,-4.3,83.3C-20.3,89.2,-35,96,-47.9,88.9C-60.8,81.8,-71.9,60.8,-77.8,40.4C-83.7,20,-84.4,0.2,-78.4,-17.1C-72.4,-34.4,-59.7,-49.2,-44.8,-58.6C-29.9,-68,-15,-72,-0.2,-71.7C14.6,-71.4,29.3,-66.8,45,-62.7Z" transform="translate(100 100)" />
          </svg>
        </div>
        <div class="wf-splatter wf-splatter--mustard" aria-hidden="true">
          <svg viewBox="0 0 200 200" fill="currentColor">
            <path d="M38.8,-52.1C50.2,-43.8,59.3,-31.8,64.7,-17.8C70.1,-3.8,71.8,12.2,66.8,26.4C61.8,40.6,50.1,53,36.2,60.4C22.3,67.8,6.2,70.2,-9.5,71.5C-25.2,72.8,-40.5,73,-52.3,64.7C-64.1,56.4,-72.4,39.6,-74.8,22.3C-77.2,5,-73.7,-12.8,-66.2,-28.7C-58.7,-44.6,-47.2,-58.6,-33.4,-65.7C-19.6,-72.8,-3.5,-73,11.3,-69.3C26.1,-65.6,27.4,-60.4,38.8,-52.1Z" transform="translate(100 100)" />
          </svg>
        </div>
        <div class="wf-logo-wrap">
          <div class="wf-logo">
            <span class="wf-logo-text">CS<span class="wf-slash">/</span><span class="wf-nz">NZ</span></span>
            <div class="wf-logo-dots">
              <span class="wf-dot wf-dot--blue">
              </span>
              <span class="wf-dot wf-dot--mustard">
              </span>
              <span class="wf-dot wf-dot--orange">
              </span>
            </div>
          </div>
        </div>
        <p class="wf-title">CSMacNz</p>
        <p class="wf-subtitle">Senior Software Engineer Portfolio</p>
        <div class="wf-progress-track">
          <div id="wf-progress-bar" class="wf-progress-bar">
          </div>
        </div>
        <div class="wf-step">
          <span class="wf-spinner" aria-hidden="true">
          </span>
          <span id="wf-step-text">Preparing platform…</span>
        </div>
        <div class="wf-region">
          <span class="wf-region-dot">
          </span>
                Aotearoa New Zealand • .NET • Blazor
            </div>
      </div>
    </div>
    <script>
        window.cvApp = window.cvApp || {};
        window.cvApp.setTheme = function (theme) {
            document.documentElement.setAttribute('data-theme', theme);
        };
        window.cvApp.printCv = function () {
            window.requestAnimationFrame(function () {
                window.print();
            });
        };
        // Expand all card narratives before printing so CSS can force them visible
        window.addEventListener('beforeprint', function () {
            document.querySelectorAll('.card-expand-toggle').forEach(function (btn) {
                btn.setAttribute('data-pre-print-expanded', btn.getAttribute('aria-expanded'));
            });
            document.documentElement.classList.add('is-printing');
        });
        window.addEventListener('afterprint', function () {
            document.querySelectorAll('.card-expand-toggle').forEach(function (btn) {
                var saved = btn.getAttribute('data-pre-print-expanded');
                if (saved !== null) {
                    btn.setAttribute('aria-expanded', saved);
                    btn.removeAttribute('data-pre-print-expanded');
                }
            });
            document.documentElement.classList.remove('is-printing');
        });
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false">
    </script>
    <script>
        (function () {
            var loader = document.getElementById('wf-loader');
            var bar = document.getElementById('wf-progress-bar');
            var stepText = document.getElementById('wf-step-text');
            var appRoot = document.getElementById('app');
            var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function setProgress(pct, label) {
                pct = Math.max(0, Math.min(100, pct));
                if (bar) bar.style.width = pct + '%';
                if (label) {
                    if (stepText) stepText.textContent = label;
                }
            }

            var loadedCount = 0;
            var resourcesToLoad = [];

            function trackResource(promise) {
                resourcesToLoad.push(promise);
                promise.then(function () {
                    loadedCount += 1;
                    var total = resourcesToLoad.length;
                    var pct = 8 + Math.floor((loadedCount / total) * 82); // 8–90%
                    setProgress(pct, 'Downloading platform…');
                }).catch(function () { /* swallow; Blazor boot will surface the real error */ });
            }

            function finishLoading() {
                if (!loader) return;
                if (prefersReducedMotion) {
                    loader.remove();
                    return;
                }
                loader.classList.add('wf-loader--hidden');
                var cleaned = false;
                function cleanup() {
                    if (cleaned) return;
                    cleaned = true;
                    if (loader.parentNode) loader.remove();
                }
                loader.addEventListener('transitionend', cleanup);
                setTimeout(cleanup, 1200);
            }

            // Use MutationObserver on #app — the real "ready" signal is Blazor's
            // first render, not just boot resolution.
            if (appRoot) {
                if ('MutationObserver' in window) {
                    var observer = new MutationObserver(function () {
                        if (appRoot.childElementCount !== 0) {
                            observer.disconnect();
                            setProgress(100, 'Ready');
                            finishLoading();
                        }
                    });
                    observer.observe(appRoot, { childList: true });
                }
            }

            Blazor.start({
                webAssembly: {
                    loadBootResource: function (type, name, defaultUri, integrity) {
                        if (type === 'dotnetjs') {
                            return defaultUri;
                        }
                        var fetchPromise = fetch(defaultUri, { integrity: integrity });
                        trackResource(fetchPromise);
                        return fetchPromise;
                    }
                }
            }).then(function () {
                setProgress(92, 'Starting engine…');
                if (!('MutationObserver' in window)) {
                    setProgress(100, 'Ready');
                    finishLoading();
                }
            }).catch(function (err) {
                setProgress(100, 'Something went wrong loading the app');
                console.error('Blazor failed to start', err);
            });
        })();
    </script>
  </body>
</html>
