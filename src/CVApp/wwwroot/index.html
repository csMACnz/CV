<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVApp</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CVApp.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.cvApp = window.cvApp || {};
        window.cvApp.setTheme = function (theme) {
            document.documentElement.setAttribute('data-theme', theme);
        };
        window.cvApp.printCv = function () {
            window.requestAnimationFrame(function () {
                window.print();
            });
        };
        // Expand all card narratives before printing so CSS can force them visible
        window.addEventListener('beforeprint', function () {
            document.querySelectorAll('.card-expand-toggle').forEach(function (btn) {
                btn.setAttribute('data-pre-print-expanded', btn.getAttribute('aria-expanded'));
            });
            document.documentElement.classList.add('is-printing');
        });
        window.addEventListener('afterprint', function () {
            document.documentElement.classList.remove('is-printing');
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
